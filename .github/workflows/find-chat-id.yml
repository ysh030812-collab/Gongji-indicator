name: 채팅 ID 찾기

# 'chat not found' 가 날 때 쓴다.
# 실행 전에 텔레그램에서 봇에게 아무 메시지나 먼저 보내야 한다.
# (봇이 최근에 받은 메시지에서 채팅 ID를 읽어오기 때문)
on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 봇이 받은 대화 목록 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m inha_notice_bot chats --env-file ""
