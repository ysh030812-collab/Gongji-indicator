name: 게시판 확인 (수동)

# PC 없이 휴대폰에서 파싱이 잘 되는지 확인할 때 쓰는 워크플로.
# Actions 탭 -> '게시판 확인 (수동)' -> 'Run workflow' 를 누르면
# 현재 게시판에서 읽어낸 공지 목록을 텔레그램으로 보내준다.
on:
  workflow_dispatch:
    inputs:
      send_to_telegram:
        description: "결과를 텔레그램으로도 받기"
        type: boolean
        default: true
      board_url:
        description: "확인할 게시판 주소 (비워두면 의과대학 공지사항)"
        type: string
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 게시판 목록 읽기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOARD_URL: ${{ inputs.board_url }}
        run: |
          EXTRA=""
          if [ "${{ inputs.send_to_telegram }}" = "true" ]; then
            EXTRA="--telegram"
          fi
          # --env-file "" : .env 파일 없이 환경변수만 사용
          python -m inha_notice_bot list --env-file "" -v $EXTRA
